spring.application.name=studyhub
spring.datasource.url=jdbc:postgresql://dpg-d8g7d1urnols73dadv8g-a.frankfurt-postgres.render.com:5432/${DB_NAME}
spring.datasource.username = ${DB_USER}
spring.datasource.password = ${DB_PASSWORD}
spring.datasource.driverClassName = org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone: UTC
spring.jpa.properties.hibernate.show-sql: false
spring.jpa.properties.hibernate.database-platform: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hibernate.ddl-auto: update
spring.jpa.open-in-view: false
spring.jpa.generate-ddl=true

spring.sql.init.platform: postgres
spring.sql.init.mode: always

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Datei-Upload: max. 5 MB pro Datei
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB