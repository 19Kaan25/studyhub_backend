# ---- Test-Profil: laeuft ohne echte Render-DB und ohne echtes JWT_SECRET ----

# H2 In-Memory-Datenbank im PostgreSQL-Kompatibilitaetsmodus (versteht u.a. den Typ TEXT)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema aus den Entities erzeugen, danach wieder verwerfen
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# Dummy-Secret nur fuer Tests (min. 32 Zeichen), damit der JwtService startet
jwt.secret=test-secret-nur-fuer-ci-mindestens-32-zeichen
jwt.expiration=86400000
